name: chatter
version: '${version}'

main: su.prismaworld.chatter.Chatter
api-version: '26.3'
load: POSTWORLD

authors: [ loseex ]

permissions:
  chatter.reload:
    description: Позволяет перезагружать конфигурацию плагина командой /chatter reload
    default: op
  chatter.spy:
    description: Позволяет следить за чужими личными сообщениями командой /socialspy
    default: op
