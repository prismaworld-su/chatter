# Все форматы и сообщения используют MiniMessage: https://docs.papermc.io/adventure/minimessage/format/
# Плейсхолдеры в форматах чата:
#   <player>  - отображаемое имя отправителя
#   <message> - текст сообщения

# Канал для сообщений без префикса: local или global.
# Действует для игроков, которые не выбирали канал командой /chat.
default-channel: local

local:
  # Радиус слышимости локального чата в блоках (только в пределах одного мира).
  radius: 128
  format: "<gray>[L]</gray> <white><player></white><dark_gray>:</dark_gray> <message>"

global:
  # Префикс, отправляющий сообщение в канал, противоположный выбранному игроком:
  # в режиме local - в глобальный чат, в режиме global - в локальный.
  prefix: "!"
  format: "<gold>[G]</gold> <white><player></white><dark_gray>:</dark_gray> <message>"

messages:
  # Отправляется игроку, если его локальное сообщение никто не услышал. Пустая строка отключает уведомление.
  # Доступен плейсхолдер <prefix> - префикс смены канала.
  nobody-heard: "<gray><italic>Вас никто не услышал: поблизости нет игроков.</italic></gray>"
  # Отправляется, если после префикса нет текста.
  empty-global: "<red>Введите текст сообщения после <prefix></red>"
  reloaded: "<green>Конфигурация Chatter перезагружена.</green>"
  usage: "<red>Использование: /chatter reload</red>"

  # Сообщения команды /chat. Плейсхолдеры: <channel> - название канала, <prefix> - префикс смены канала.
  channel-current: "<gray>Сообщения без префикса уходят в <white><channel></white> чат. Сменить: /chat local или /chat global</gray>"
  channel-switched: "<green>Сообщения без префикса теперь уходят в <white><channel></white> чат. Префикс <white><prefix></white> отправит сообщение в другой канал.</green>"
  channel-usage: "<red>Использование: /chat local или /chat global</red>"
  player-only: "<red>Эта команда доступна только игрокам.</red>"
  channel-names:
    local: "локальный"
    global: "глобальный"
