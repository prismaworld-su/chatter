# Все форматы и сообщения используют MiniMessage: https://docs.papermc.io/adventure/minimessage/format/
# Плейсхолдеры в форматах чата:
#   <player>  - отображаемое имя отправителя
#   <message> - текст сообщения

# Канал для сообщений без префикса: local или global.
# Действует для игроков, которые не выбирали канал командой /chat.
default-channel: local

# Личные настройки чата по умолчанию. Действуют, пока игрок не изменил их в меню /chat.
default-preferences:
  # Получать и отправлять сообщения глобального чата.
  global-chat: true
  # Видеть сообщения о входе и выходе игроков.
  join-quit: true
  # Видеть сообщения о смерти игроков.
  death-messages: true
  # Видеть сообщения о получении достижений.
  advancements: true
  # Слышать звук, когда ник игрока упоминают в чате.
  mention-sound: true
  # Получать и отправлять личные сообщения.
  private-messages: true
  # Слышать звук при получении личного сообщения.
  private-message-sound: true

local:
  # Радиус слышимости локального чата в блоках (только в пределах одного мира).
  radius: 128
  format: "<gray>[L]</gray> <white><player></white><dark_gray>:</dark_gray> <message>"

global:
  # Префикс, отправляющий сообщение в канал, противоположный выбранному игроком:
  # в режиме local - в глобальный чат, в режиме global - в локальный.
  prefix: "!"
  format: "<gold>[G]</gold> <white><player></white><dark_gray>:</dark_gray> <message>"

# Звук, который слышит игрок, когда его ник упоминают в чате.
mention-sound:
  # Ключ звука: https://minecraft.wiki/w/Sounds.json
  sound: "minecraft:entity.experience_orb.pickup"
  volume: 1.0
  # От 0 до 2.
  pitch: 1.0

# Модули сообщений: заменяются в тексте игрока на интерактивные элементы. Заменяются все вхождения.
modules:
  # :loc: - координаты блока, на котором стоит игрок. По нажатию копируются в буфер обмена.
  # Плейсхолдеры: <x>, <y>, <z>.
  loc:
    enabled: true
    format: "[<x>, <y>, <z>]"
    # Текст, который копируется в буфер обмена (без MiniMessage).
    clipboard: "<x> <y> <z>"
    # Подсказка при наведении. Пустая строка отключает подсказку.
    hover: "<gray>Нажмите, чтобы скопировать координаты</gray>"
    # Цвет координат в зависимости от измерения: название цвета (green) или HEX (#55FF55).
    colors:
      overworld: green
      nether: red
      end: dark_purple
      # Измерения, добавленные другими плагинами или датапаками.
      custom: white
  # :item: - название предмета в основной руке. Весь текст модуля окрашивается в цвет редкости предмета,
  # при наведении показываются его характеристики. Если рука пуста, модуль удаляется из сообщения.
  # Плейсхолдер: <item> - название предмета.
  item:
    enabled: true
    format: "[<item>]"

# Личные сообщения игрокам в сети.
#   /w <игрок> <текст> (синонимы /msg, /tell, /m) - написать игроку.
#   /r <текст> - ответить последнему собеседнику: тому, кто написал вам последним, или тому, кому написали вы.
# В личных сообщениях работают модули (:loc:, :item:).
private-messages:
  # Плейсхолдеры в форматах: <sender> - отправитель, <recipient> - получатель, <message> - текст сообщения.
  # По нажатию на ник собеседника в чат подставляется команда, чтобы написать ему.
  format-sent: "<gray>[<white>Вы</white> → <white><recipient></white>]</gray> <message>"
  format-received: "<gray>[<white><sender></white> → <white>Вам</white>]</gray> <message>"
  # Подсказка при наведении на ник собеседника. Пустая строка отключает подсказку.
  reply-hover: "<gray>Нажмите, чтобы написать игроку</gray>"
  # Звук, который слышит получатель. Игрок может отключить его в меню /chat.
  sound:
    # Ключ звука: https://minecraft.wiki/w/Sounds.json
    sound: "minecraft:block.note_block.pling"
    volume: 1.0
    # От 0 до 2.
    pitch: 1.0
  # Пустая строка отключает сообщение.
  messages:
    usage: '<red>Использование: /w \<игрок> \<сообщение></red>'
    reply-usage: '<red>Использование: /r \<сообщение></red>'
    # Плейсхолдер <player> - ник игрока.
    player-not-found: "<red>Игрок <white><player></white> не в сети.</red>"
    self: "<red>Нельзя написать самому себе.</red>"
    no-reply-target: "<red>Вам некому ответить: вы ещё ни с кем не переписывались.</red>"
    # Отправляется, если у отправителя личные сообщения отключены в настройках.
    disabled: "<red>Личные сообщения отключены в ваших настройках. Включить: /chat</red>"
    # Плейсхолдер <player> - ник получателя.
    recipient-disabled: "<red>Игрок <white><player></white> не принимает личные сообщения.</red>"

messages:
  # Отправляется игроку, если его локальное сообщение никто не услышал. Пустая строка отключает уведомление.
  # Доступен плейсхолдер <prefix> - префикс смены канала.
  nobody-heard: "<gray><italic>Вас никто не услышал: поблизости нет игроков.</italic></gray>"
  # Отправляется, если после префикса нет текста.
  empty-global: "<red>Введите текст сообщения после <prefix></red>"
  # Отправляется, если после замены модулей сообщение оказалось пустым (например, только :item: при пустой руке).
  empty-message: "<red>Сообщение не может быть пустым.</red>"
  # Отправляется при попытке написать в глобальный чат или выбрать его, когда он отключён в настройках.
  global-disabled: "<red>Глобальный чат отключён в ваших настройках. Включить: /chat</red>"
  reloaded: "<green>Конфигурация Chatter перезагружена.</green>"
  usage: "<red>Использование: /chatter reload</red>"

  # Сообщения команды /chat. Плейсхолдеры: <channel> - название канала, <prefix> - префикс смены канала.
  channel-switched: "<green>Сообщения без префикса теперь уходят в <white><channel></white> чат. Префикс <white><prefix></white> отправит сообщение в другой канал.</green>"
  channel-usage: "<red>Использование: /chat, /chat local или /chat global</red>"
  player-only: "<red>Эта команда доступна только игрокам.</red>"
  channel-names:
    local: "локальный"
    global: "глобальный"

# Меню настроек чата, открывается командой /chat.
# Плейсхолдеры в описаниях: <state> - состояние настройки, <channel> - название канала, <prefix> - префикс смены канала.
menu:
  title: "Настройки чата"
  state-enabled: "<green>включено</green>"
  state-disabled: "<red>выключено</red>"
  items:
    channel:
      name: "<yellow>Канал по умолчанию</yellow>"
      lore:
        - "<gray>Куда уходят сообщения без префикса.</gray>"
        - "<gray>Префикс <white><prefix></white> отправит сообщение в другой канал.</gray>"
        - ""
        - "<gray>Сейчас: <white><channel></white></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    global-chat:
      name: "<yellow>Глобальный чат</yellow>"
      lore:
        - "<gray>Получать и отправлять сообщения</gray>"
        - "<gray>глобального чата.</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    join-quit:
      name: "<yellow>Вход и выход игроков</yellow>"
      lore:
        - "<gray>Сообщения о входе и выходе</gray>"
        - "<gray>игроков с сервера.</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    death-messages:
      name: "<yellow>Сообщения о смерти</yellow>"
      lore:
        - "<gray>Сообщения о смерти игроков.</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    advancements:
      name: "<yellow>Достижения</yellow>"
      lore:
        - "<gray>Сообщения о получении</gray>"
        - "<gray>достижений игроками.</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    mention-sound:
      name: "<yellow>Звук упоминания</yellow>"
      lore:
        - "<gray>Звук, когда ваш ник</gray>"
        - "<gray>упоминают в чате.</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    private-messages:
      name: "<yellow>Личные сообщения</yellow>"
      lore:
        - "<gray>Получать и отправлять</gray>"
        - "<gray>личные сообщения (/w, /r).</gray>"
        - ""
        - "<gray>Сейчас: <state></gray>"
        - ""
        - "<yellow>Нажмите, чтобы переключить</yellow>"
    private-message-sound:
